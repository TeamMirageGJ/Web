  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">
      This page requires JavaScript to display.
    </div>

  <div id="__bundler_placeholder">Loading Mirage Controller...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  window.addEventListener('error', function(e) {

    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; 

      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }

    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; 
    const pendingRelays = {}; 
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;

      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {

        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; 
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }

        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {

        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {

          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');

    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
		
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }

    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

nt:600 16px 'Hanken Grotesk',sans-serif;border-radius:10px;padding:14px 24px;text-decoration:none;border:0;cursor:pointer;min-height:44px;box-sizing:border-box}\n.shot{width:100%;display:block;border-radius:14px;border:1px solid #2E2650}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"background:#120E24;color:#F3E8D2;font:400 18px/1.6 'Hanken Grotesk',system-ui,sans-serif;min-height:100%\" data-canvas-width=\"1360\" data-canvas-height=\"4300\" data-document-role=\"page\" data-label=\"Landing\">\n\n<div class=\"wrap\" style=\"display:flex;align-items:center;gap:24px;flex-wrap:wrap;height:auto;padding-top:22px;padding-bottom:22px\">\n<span class=\"d\" style=\"font-size:18px;font-weight:700\">Mirage Controller<\u002Fspan>\n<span style=\"flex:1\"><\u002Fspan>\n<a href=\"#demo\" style=\"color:#F3E8D2;text-decoration:none;font-weight:600\">Probalo<\u002Fa>\n<a href=\"#pasos\" style=\"color:#F3E8D2;text-decoration:none;font-weight:600\">Cómo funciona<\u002Fa>\n<a href=\"#control\" style=\"color:#F3E8D2;text-decoration:none;font-weight:600\">Control<\u002Fa>\n<\u002Fdiv>\n\n<div class=\"wrap\" style=\"padding-top:72px;padding-bottom:72px\">\n<h1 class=\"d\" style=\"font-size:clamp(44px,8vw,104px);font-weight:900;max-width:11ch\">Tu chat controla tu PC.<\u002Fh1>\n<p style=\"max-width:44ch;font-size:22px;color:#C9C2E3;margin:28px 0 36px\">Mirage Controller deja que tus viewers de Twitch activen overlays, atajos y comandos propios mientras transmitís. Gratis, para Windows.<\u002Fp>\n<div style=\"display:flex;gap:14px;flex-wrap:wrap;align-items:center\">\n<span class=\"btn\" style=\"background:#2E2650;color:#A79FC8;cursor:default\">Descarga gratis: próximamente<\u002Fspan>\n<a class=\"btn\" href=\"https://discord.gg/3faZHrnd4j\" style=\"background:#FF7A59;color:#1A0F10\">Seguinos en Discord<\u002Fa>\n<\u002Fdiv>\n<div style=\"margin-top:64px\"><img class=\"shot\" src=\"4aa24744-f426-448c-9802-4b4430489f84\" alt=\"Pantalla de inicio de Mirage Controller con el chat conectado y la actividad en vivo\"><\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"demo\" class=\"wrap\" style=\"padding-top:56px;padding-bottom:56px\">\n<h2 class=\"d\" style=\"font-size:clamp(30px,5vw,52px)\">Probalo vos.<\u002Fh2>\n<p style=\"color:#C9C2E3;max-width:52ch\">Escribí como si fueras el chat y mirá qué pasa en la pantalla del streamer.<\u002Fp>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:24px;margin-top:32px\">\n\n<div style=\"background:#1B1535;border:1px solid #2E2650;border-radius:16px;padding:24px\">\n<div style=\"font:600 14px 'Hanken Grotesk';color:#A79FC8;margin-bottom:14px\">Chat de Twitch<\u002Fdiv>\n<div style=\"min-height:190px;display:flex;flex-direction:column;gap:8px;font-size:16px\">\n<sc-for list=\"{{log}}\" as=\"l\" hint-placeholder-count=\"3\"><div><span style=\"color:#22D3EE;font-weight:600\">{{l.u}}<\u002Fspan> <span style=\"color:#F3E8D2\">{{l.c}}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:10px;margin-top:18px\">\n<button class=\"btn\" style=\"background:#2E2650;color:#F3E8D2\" sc-camel-on-click=\"{{c1}}\">%+1<\u002Fbutton>\n<button class=\"btn\" style=\"background:#2E2650;color:#F3E8D2\" sc-camel-on-click=\"{{c2}}\">%hype<\u002Fbutton>\n<button class=\"btn\" style=\"background:#2E2650;color:#F3E8D2\" sc-camel-on-click=\"{{c3}}\">%pet<\u002Fbutton>\n<button class=\"btn\" style=\"background:#2E2650;color:#F3E8D2\" sc-camel-on-click=\"{{c4}}\">%paint<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"background:#0B0816;border:1px solid #2E2650;border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:20px\">\n<div style=\"font:600 14px 'Hanken Grotesk';color:#A79FC8\">Pantalla del streamer<\u002Fdiv>\n<div><div style=\"font-size:14px;color:#A79FC8\">Contador de muertes<\u002Fdiv><div class=\"d\" style=\"font-size:64px;color:#22D3EE\">{{n}}<\u002Fdiv><\u002Fdiv>\n<div><div style=\"font-size:14px;color:#A79FC8;display:flex;justify-content:space-between\"><span>Barra de hype<\u002Fspan><span>{{hypeTxt}}<\u002Fspan><\u002Fdiv>\n<div style=\"height:14px;background:#2E2650;border-radius:7px;overflow:hidden;margin-top:6px\"><div style=\"height:100%;background:#FF7A59;transition:width .3s;{{hypeW}}\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"font-size:16px\">{{petTxt}}<\u002Fdiv>\n<div style=\"font-size:16px;color:#F3E8D2;border-top:1px solid #2E2650;padding-top:14px\"><span style=\"color:#A79FC8\">En la PC:<\u002Fspan> {{pc}}<\u002Fdiv>\n<div><button class=\"btn\" style=\"background:none;color:#A79FC8;border:1px solid #2E2650;padding:8px 16px\" sc-camel-on-click=\"{{reset}}\">Reiniciar<\u002Fbutton><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"wrap\" style=\"padding-top:72px;padding-bottom:24px\">\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:48px;align-items:center\">\n<div><h2 class=\"d\" style=\"font-size:clamp(28px,4vw,44px)\">Overlays que reaccionan.<\u002Fh2>\n<p style=\"color:#C9C2E3\">Un contador, un pulsómetro, una barra de hype y una mascota virtual aparecen sobre tu juego o en OBS. El chat los sube, los baja y los hace explotar. Los movés con el mouse a donde quieras.<\u002Fp><\u002Fdiv>\n<img class=\"shot\" src=\"bf6d8c7a-2afa-4b13-87c0-0b8ebbe84560\" alt=\"Pantalla de overlays: contador, pulsómetro, barra de hype y mascota\">\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:48px;align-items:center;margin-top:96px\">\n<img class=\"shot\" src=\"21979f03-a8de-4621-872f-0a2beb8b717e\" alt=\"Lista de comandos con interruptores, permisos y esperas\">\n<div><h2 class=\"d\" style=\"font-size:clamp(28px,4vw,44px)\">Tus propios comandos.<\u002Fh2>\n<p style=\"color:#C9C2E3\">Armá un comando en un minuto: que abra una web o un programa, o que muestre un mensaje. Elegís quién puede usarlo y cada cuánto, sin tocar código. También hay comandos listos para abrir Paint, escribir texto o presionar teclas.<\u002Fp>\n<p style=\"color:#A79FC8;font-size:16px\">Canjes de puntos del canal: en beta.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"pasos\" class=\"wrap\" style=\"padding-top:96px;padding-bottom:24px\">\n<h2 class=\"d\" style=\"font-size:clamp(30px,5vw,52px)\">Tres pasos.<\u002Fh2>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:40px;margin-top:36px\">\n<div><div class=\"d\" style=\"font-size:72px;color:#FF7A59\">1<\u002Fdiv><div style=\"font-weight:600;font-size:20px\">Conectá tu canal<\u002Fdiv><p style=\"color:#C9C2E3;margin-top:6px\">Un solo botón y autorizás con tu cuenta de Twitch.<\u002Fp><\u002Fdiv>\n<div><div class=\"d\" style=\"font-size:72px;color:#FF7A59\">2<\u002Fdiv><div style=\"font-weight:600;font-size:20px\">Elegí qué puede hacer el chat<\u002Fdiv><p style=\"color:#C9C2E3;margin-top:6px\">Prendés los comandos que quieras con un interruptor.<\u002Fp><\u002Fdiv>\n<div><div class=\"d\" style=\"font-size:72px;color:#FF7A59\">3<\u002Fdiv><div style=\"font-weight:600;font-size:20px\">Transmití<\u002Fdiv><p style=\"color:#C9C2E3;margin-top:6px\">Lo que pase lo ves en vivo en la actividad de la app.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"control\" class=\"wrap\" style=\"padding-top:96px;padding-bottom:24px\">\n<h2 class=\"d\" style=\"font-size:clamp(30px,5vw,52px);max-width:16ch\">Vos mandás, no el chat.<\u002Fh2>\n<p style=\"color:#C9C2E3;max-width:56ch\">Un chat abierto controlando una PC da respeto, así que cada comando tiene dueño y freno.<\u002Fp>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:32px;margin-top:32px\">\n<div style=\"border-top:1px solid #2E2650;padding-top:18px\"><div style=\"font-weight:600;font-size:19px\">Cuatro niveles<\u002Fdiv><p style=\"color:#C9C2E3;margin-top:6px\">Todos, subs y VIPs, mods o solo vos, comando por comando.<\u002Fp><\u002Fdiv>\n<div style=\"border-top:1px solid #2E2650;padding-top:18px\"><div style=\"font-weight:600;font-size:19px\">Esperas<\u002Fdiv><p style=\"color:#C9C2E3;margin-top:6px\">Tiempo entre usos para frenar el spam y a los trolls.<\u002Fp><\u002Fdiv>\n<div style=\"border-top:1px solid #2E2650;padding-top:18px\"><div style=\"font-weight:600;font-size:19px\">Perfiles rápidos<\u002Fdiv><p style=\"color:#C9C2E3;margin-top:6px\">Seguro, Interactivo o Caos: cambiás todo de una vez.<\u002Fp><\u002Fdiv>\n<div style=\"border-top:1px solid #2E2650;padding-top:18px\"><div style=\"font-weight:600;font-size:19px\">Lo peligroso, escondido<\u002Fdiv><p style=\"color:#C9C2E3;margin-top:6px\">Los comandos de consola solo aparecen si activás el modo avanzado.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"wrap\" style=\"padding-top:104px;padding-bottom:64px\">\n<div style=\"background:#1B1535;border:1px solid #2E2650;border-radius:20px;padding:48px;display:flex;flex-wrap:wrap;gap:28px;align-items:center;justify-content:space-between\">\n<div><h2 class=\"d\" style=\"font-size:clamp(26px,4vw,40px)\">Gratis, en español e inglés.<\u002Fh2><p style=\"color:#C9C2E3;margin:10px 0 0\">Para Windows. En desarrollo: contanos qué te gustaría que haga.<\u002Fp><\u002Fdiv>\n<a class=\"btn\" href=\"https://discord.gg/3faZHrnd4j\" style=\"background:#FF7A59;color:#1A0F10\">Seguinos en Discord<\u002Fa>\n<\u002Fdiv>\n<p style=\"color:#A79FC8;font-size:15px;margin-top:40px\">Hecho por Team Mirage · <a href=\"mailto:MirageTeam11@gmail.com\">MirageTeam11@gmail.com<\u002Fa><\u002Fp>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1360,&quot;height&quot;:4300}}\">\nclass Component extends DCLogic {\n  state = { k: 0, n: 0, hype: 0, pet: 0, pc: '', log: [{u:'lucia_vt',c:'%hype'},{u:'pepito99',c:'%+1'},{u:'nico_gg',c:'%pet'}] };\n  fire(cmd) {\n    const s = this.state, U = ['lucia_vt','pepito99','nico_gg','mari_exe'];\n    this.setState({\n      k: s.k + 1,\n      n: s.n + (cmd === '%+1' ? 1 : 0),\n      hype: cmd === '%hype' ? Math.min(100, s.hype + 25) : s.hype,\n      pet: cmd === '%pet' ? s.pet + 1 : s.pet,\n      pc: cmd === '%paint' ? 'Se abrió Paint en la PC del streamer' : s.pc,\n      log: [...s.log, { u: U[s.k % 4], c: cmd }].slice(-5)\n    });\n  }\n  renderVals() {\n    const s = this.state, moods = ['Mascota: contenta', 'Mascota: feliz', 'Mascota: encantada'];\n    return {\n      n: s.n,\n      hypeW: 'width:' + s.hype + '%',\n      hypeTxt: s.hype >= 100 ? 'Hype al máximo' : s.hype + '%',\n      petTxt: s.pet ? moods[Math.min(2, s.pet - 1)] : 'Mascota: tranquila',\n      pc: s.pc || 'Nada por ahora',\n      log: s.log,\n      c1: () => this.fire('%+1'), c2: () => this.fire('%hype'), c3: () => this.fire('%pet'), c4: () => this.fire('%paint'),\n      reset: () => this.setState({ k: 0, n: 0, hype: 0, pet: 0, pc: '', log: [] })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
