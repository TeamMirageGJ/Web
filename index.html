<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Mirage</title>

<link rel="icon" type="image/png" sizes="64x64" href="images/favicon-64.png">

<style>
/* === MODO "UN SOLO PLANO" === */
body {
    background: #00AEEF;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    margin: 0;
    height: 100vh; /* Ocupa exactamente la pantalla */
    overflow: hidden; /* Adiós barra de desplazamiento general */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center; /* Centra el contenedor en el medio exacto */
}

.navbar {
    position: fixed;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 15px;
    background: rgba(255,255,255,.2);
    padding: 10px 15px;
    border-radius: 12px;
    z-index: 100;
}

.navbar button {
    background: none;
    border: none;
    color: white;
    font-weight: bold;
    cursor: pointer;
    padding: 6px 12px;
    border-radius: 6px;
}

.navbar button:hover {
    background: rgba(255,255,255,.3);
}

.container {
    max-width: 720px;
    width: 90%;
    max-height: 65vh; /* Limita la altura para que no choque con los bordes */
    background: rgba(255,255,255,.1);
    padding: 20px 25px;
    border-radius: 15px;
    box-shadow: 5px 5px 15px rgba(0,0,0,.2);
    transition: opacity .4s ease, transform .4s ease;
    
    /* Scroll invisible interno por si la pantalla es muy pequeña */
    overflow-y: auto; 
    -ms-overflow-style: none;  /* IE y Edge */
    scrollbar-width: none;  /* Firefox */
}

/* Ocultar barra de desplazamiento en Chrome/Safari/Opera */
.container::-webkit-scrollbar {
    display: none;
}

.hidden {
    opacity: 0;
    transform: translateY(-15px);
}

/* Imágenes un poco más pequeñas para ahorrar espacio vertical */
.thumbnail {
    max-width: 110px; 
    margin: 8px;
    border-radius: 10px;
    cursor: pointer;
    transition: .3s;
}

.thumbnail:hover {
    transform: scale(1.1);
}

button.action {
    background: linear-gradient(45deg,#00CFFF,#007ACC);
    border: none;
    color: white;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    margin: 5px;
}

.submenu {
    margin-top: 15px;
    padding-top: 15px;
    border-top: 1px solid rgba(255,255,255,.3);
}

.redes-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(140px,1fr));
    gap: 12px;
    margin-top: 16px;
}

.red {
    padding: 10px;
    border-radius: 10px;
    background: rgba(255,255,255,.2);
    font-weight: bold;
    transition: .2s;
    text-decoration: none;
    color: white;
    font-size: 14px; /* Un pelín más pequeño para que entren bien los nombres largos */
}

.red:hover {
    transform: translateY(-3px);
    background: rgba(255,255,255,.35);
}

/* Estilos de Textos y Cartas */
.hero-subtitle {
    color: #E1F5FE;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-size: 13px;
    margin-bottom: 15px;
    background: rgba(0,0,0,0.15);
    display: inline-block;
    padding: 5px 15px;
    border-radius: 20px;
}

.texto-destacado {
    font-size: 16px;
    line-height: 1.5;
    margin-bottom: 15px;
}

.dev-cards {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 20px 0;
    flex-wrap: wrap;
}

.dev-card {
    background: rgba(0, 0, 0, 0.2);
    padding: 12px 25px;
    border-radius: 12px;
    border: 2px solid transparent;
    transition: 0.3s;
    cursor: pointer;
}

.dev-card:hover {
    transform: translateY(-5px);
    background: rgba(0, 0, 0, 0.3);
    border-color: #00CFFF;
    box-shadow: 0 5px 15px rgba(0, 207, 255, 0.3);
}

.dev-card h3 {
    margin: 0 0 5px 0;
    font-size: 18px;
    color: #fff;
}

.dev-card p {
    margin: 0;
    font-size: 12px;
    color: #B3E5FC;
    text-transform: uppercase;
    font-weight: bold;
}

.profile-pic {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid rgba(255,255,255,0.3);
    box-shadow: 0 0 15px rgba(0, 207, 255, 0.5);
    margin-bottom: 10px;
    transition: 0.3s;
}

.profile-pic:hover {
    transform: scale(1.05);
    border-color: #fff;
}

/* === ELEMENTOS FIJOS AJUSTADOS === */
.site-footer {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    padding: 8px;
    font-size: 12px;
    background: rgba(0,0,0,0.15);
    z-index: 10;
}

#lang-btn {
    position: fixed;
    bottom: 40px; /* Un poco más arriba para no pisar el footer */
    left: 20px;
    background: rgba(255,255,255,.25);
    border: none;
    color: white;
    font-weight: bold;
    padding: 10px 16px;
    border-radius: 10px;
    cursor: pointer;
    z-index: 50;
}

.dog-button {
    position: fixed;
    bottom: 40px; /* Un poco más arriba para no pisar el footer */
    right: 20px;
    width: 70px;
    cursor: pointer;
    animation: spin 3s linear infinite;
    z-index: 50;
}

#dog-counter {
    position: fixed;
    bottom: 110px; /* Flotando justo arriba del perro */
    right: 35px;
    font-weight: bold;
    opacity: .8;
    text-align: center;
    z-index: 50;
}

@keyframes spin {
    to {transform: rotate(360deg);}
}
</style>
</head>

<body>

<nav class="navbar" id="navbar">
    <button onclick="inicio()"></button>
    <button onclick="proyectos()"></button>
    <button onclick="traducciones()"></button>
    <button onclick="redes()"></button>
</nav>

<div class="container" id="content"></div>

<div id="dog-counter">🐶</div>

<footer class="site-footer" id="site-footer"></footer>

<button id="lang-btn" onclick="toggleLang()">ENGLISH</button>
<img src="images/toby.png" class="dog-button" onclick="dog()" alt="perro">

<script>
let content;
let currentSection="";
let lang="es";

let dogCooldown=false;
let dogCount=0;

document.addEventListener("DOMContentLoaded",()=>{
    content=document.getElementById("content");
    updateDynamicText();
    inicio();
});

function updateDynamicText(){
    const b=document.querySelectorAll("#navbar button");
    if(lang==="es"){
        b[0].textContent="Inicio";
        b[1].textContent="Proyectos";
        b[2].textContent="Traducciones";
        b[3].textContent="Redes";
        document.getElementById("site-footer").innerHTML="&copy; 2026 Mirage Team. Todos los derechos reservados.";
    }else{
        b[0].textContent="Home";
        b[1].textContent="Projects";
        b[2].textContent="Translations";
        b[3].textContent="Socials";
        document.getElementById("site-footer").innerHTML="&copy; 2026 Mirage Team. All rights reserved.";
    }
}

function toggleLang(){
    lang = lang==="es" ? "en":"es";
    document.getElementById("lang-btn").textContent =
        lang==="es" ? "ENGLISH":"ESPAÑOL";
    updateDynamicText();
    inicio();
}

function setContent(html,section){
    if(currentSection===section && section!=="inicio") return;
    currentSection=section;
    content.classList.add("hidden");
    setTimeout(()=>{
        content.innerHTML=html;
        content.classList.remove("hidden");
    },300);
}

function inicio(){
    setContent(`
        <h1 style="font-size: 2.2em; margin-bottom: 5px; margin-top: 0;">Mirage Team</h1>
        <div class="hero-subtitle">
            ${lang === "es" ? "🛠️ Desarrolladores Indie Principiantes 🛠️" : "🛠️ Beginner Indie Developers 🛠️"}
        </div>

        <p class="texto-destacado">
        ${lang === "es"
        ? "Creamos videojuegos con <strong>identidad propia</strong> y experiencias que realmente se disfruten. Cuidamos cada detalle para ofrecer juegos de calidad."
        : "We create games with a <strong>strong identity</strong> and truly enjoyable experiences. We care about every detail to deliver high-quality games."}
        </p>

        <div class="dev-cards">
            <div class="dev-card" onclick="valens429()">
                <h3>Valens429</h3>
                <p>${lang === "es" ? "Desarrollador" : "Developer"}</p>
            </div>
            <div class="dev-card" onclick="sejerodev()">
                <h3>SejeroDev</h3>
                <p>${lang === "es" ? "Desarrollador" : "Developer"}</p>
            </div>
        </div>

        <button class="action" onclick="proyectos()" style="font-size: 16px; padding: 12px 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
            🚀 ${lang === "es" ? "Ver nuestros proyectos" : "See our projects"}
        </button>
    `,"inicio");
}

function proyectos(){
    setContent(`
        <h1 style="margin-top:0;">${lang==="es" ? "Proyectos" : "Projects"}</h1>

        <img src="images/f1.png" class="thumbnail" onclick="proyecto(
            'Deltarune x Cult of the Lamb',
            '${lang==="es"?"Fangame crossover con combates y lore oscuro.":"Crossover fangame with battles and dark lore."}',
            'https://gamejolt.com/games/COTLXDR/975891',
            'proyectos'
        )">

        <img src="images/f2.png" class="thumbnail" onclick="proyecto(
            'Undertale Bastille',
            '${lang==="es"?"Proyecto inspirado en Undertale con nuevas mecánicas.":"Undertale-inspired project with new mechanics."}',
            'https://gamejolt.com/games/Undertale-Bastille/987997',
            'proyectos'
        )">

        <img src="images/f3.png" class="thumbnail" onclick="proyecto(
            'Papers Please España',
            '${lang==="es"?"Una parodia de Papers Please creada a base de memes.":"A parody of Papers Please created using memes."}',
            'https://gamejolt.com/games/PAPERSPLEASECESP/997156',
            'proyectos'
        )">

        <div class="submenu" style="display:flex; justify-content:center; gap:15px; flex-wrap:wrap;">
            <button class="action" onclick="proyectosIndividuales()">
                👤 ${lang==="es"?"Proyectos Individuales":"Individual Projects"}
            </button>
            <button class="action" onclick="herramientas()">
                🛠️ ${lang==="es"?"Herramientas":"Tools"}
            </button>
        </div>
    `,"proyectos");
}

function proyectosIndividuales(){
    setContent(`
        <h1 style="margin-top:0;">${lang==="es"?"Proyectos Individuales":"Individual Projects"}</h1>
        
        <div style="display:flex; justify-content:center; gap:20px; flex-wrap:wrap; margin-top:20px;">
            <button class="action" style="font-size:18px; padding:15px 30px;" onclick="valens429()">Valens429</button>
            <button class="action" style="font-size:18px; padding:15px 30px;" onclick="sejerodev()">SejeroDEV</button>
        </div>

        <div class="submenu">
            <button class="action" onclick="proyectos()">← ${lang==="es"?"Volver":"Back"}</button>
        </div>
    `,"proyectosIndividuales");
}

function valens429(){
    setContent(`
        <h1 style="margin-top:0;">Valens429</h1>

        <img src="images/f4.png" class="thumbnail" onclick="proyecto(
            'Session Zero',
            '${lang==="es"?"¿Listo?":"Ready?"}',
            'https://gamejolt.com/games/SessionZero/1031786',
            'valens429'
        )">

        <img src="images/py2.png" class="thumbnail" onclick="proyecto(
            'Seii´s Crackhouse',
            '${lang==="es"?"Versión modificada de Raldis Crackhouse para Seii.":"Modified version of Raldis Crackhouse for Seii."}',
            'https://gamejolt.com/games/SEIICRACKHOUSE/973565',
            'valens429'
        )">

        <div class="submenu">
            <button class="action" onclick="proyectosIndividuales()">← ${lang==="es"?"Volver":"Back"}</button>
        </div>
    `,"valens429");
}

function sejerodev(){
    setContent(`
        <h1 style="margin-top:0;">SejeroDEV</h1>

        <img src="images/sonic.png" class="thumbnail" onclick="proyecto(
            'Sonic Exodus',
            '${lang==="es"?"Un nuevo fangame de la saga del erizo azul.":"A new fangame from the blue blur series."}',
            'https://gamejolt.com/games/Sonic-Exodus/1031667',
            'sejerodev'
        )">

        <img src="images/cony.png" class="thumbnail" onclick="proyecto(
            'Cony the Confronter',
            '${lang==="es"?"Una aventura única llena de desafíos.":"A unique adventure full of challenges."}',
            'https://gamejolt.com/games/Cony-the-Confronter/973146',
            'sejerodev'
        )">

        <div class="submenu">
            <button class="action" onclick="proyectosIndividuales()">← ${lang==="es"?"Volver":"Back"}</button>
        </div>
    `,"sejerodev");
}

function herramientas(){
    setContent(`
        <h1 style="margin-top:0;">${lang==="es"?"Herramientas":"Tools"}</h1>

        <img src="images/py1.png" class="thumbnail" onclick="proyecto(
            'DELTARUNE Save File Management',
            '${lang==="es"?"Administra tus partidas de forma rápida y segura.":"Manage your games quickly and securely."}',
            'https://gamejolt.com/games/DELTARUNESAVE/1006615',
            'herramientas'
        )">

        <img src="images/SMM.png" class="thumbnail" onclick="proyecto(
            'Soul Mod Manager',
            '${lang==="es"?"Un gestor de mods para personalizar tu experiencia.":"A mod manager to customize your experience."}',
            'https://gamejolt.com/games/SMM/978626',
            'herramientas'
        )">

        <div class="submenu">
            <button class="action" onclick="proyectos()">← ${lang==="es"?"Volver":"Back"}</button>
        </div>
    `,"herramientas");
}

function proyecto(nombre,desc,link, backFunc){
    setContent(`
        <h1 style="margin-top:0;">${nombre}</h1>
        <p>${desc}</p>
        <a href="${link}" target="_blank">
            <button class="action">${lang==="es"?"Ir a GameJolt":"Go to GameJolt"}</button>
        </a>
        <div class="submenu">
            <button class="action" onclick="${backFunc}()">← ${lang==="es"?"Volver":"Back"}</button>
        </div>
    `,"proyecto");
}

function udtsl(){
    setContent(`
        <h1 style="margin-top:0;">Undertale: Souls Link</h1>

        <p>
            ${lang==="es"
                ? "Traducción al español"
                : "Spanish translation"}
        </p>

        <div style="display:flex;flex-wrap:wrap;gap:15px;justify-content:center;margin-top:20px;">
            <a href="udtsl/7_1 Español.png" download>
                <button class="action" style="font-size:16px;padding:12px 20px;">📥 7_1</button>
            </a>
            <a href="udtsl/7_2 Español.png" download>
                <button class="action" style="font-size:16px;padding:12px 20px;">📥 7_2</button>
            </a>
            <a href="udtsl/7_3 Español.png" download>
                <button class="action" style="font-size:16px;padding:12px 20px;">📥 7_3</button>
            </a>
            <a href="udtsl/8_1 Español.png" download>
                <button class="action" style="font-size:16px;padding:12px 20px;">📥 8_1</button>
            </a>
        </div>

        <div class="submenu">
            <button class="action" onclick="traducciones()">
                ← ${lang==="es" ? "Volver" : "Back"}
            </button>
        </div>
    `,"udtsl");
}

function purrfect2(){
    setContent(`
        <h1 style="margin-top:0;">Purrfect Apawncalypse 2 Parche</h1>

        <p>
            ${lang==="es"
                ? "Parche de traducción al español."
                : "Spanish translation patch."}
        </p>

        <div style="display:flex;flex-wrap:wrap;gap:15px;justify-content:center;margin-top:20px;">
            <a href="https://gamejolt.com/games/PurrfectApawncalypse2ESP/1053196" target="_blank">
                <button class="action" style="font-size:16px;padding:14px 22px;">
                    🎮 ${lang==="es" ? "Ir a GameJolt" : "Go to GameJolt"}
                </button>
            </a>

            <a href="Downloads/Purrfect2.rar" download>
                <button class="action" style="font-size:16px;padding:14px 22px;">
                    📥 ${lang==="es" ? "Descargar Parche" : "Download Patch"}
                </button>
            </a>
        </div>

        <div class="submenu">
            <button class="action" onclick="traducciones()">
                ← ${lang==="es" ? "Volver" : "Back"}
            </button>
        </div>
    `,"purrfect2");
}

function traducciones(){
    setContent(`
        <h1 style="margin-top:0;">${lang==="es" ? "Traducciones" : "Translations"}</h1>
        <img src="images/t1.png" class="thumbnail" onclick="udtsl()">
        <img src="images/Purrfect2.png" class="thumbnail" onclick="purrfect2()">
    `,"traducciones");
}

function redes(){
    setContent(`
        <h1 style="margin-top:0;">${lang==="es"?"Redes de Mirage Team":"Mirage Team Socials"}</h1>
        <div class="redes-grid">
            <a class="red" href="https://discord.gg/3faZHrnd4j" target="_blank">Discord</a>
            <a class="red" href="https://gamejolt.com/@MirageTeam" target="_blank">GameJolt</a>
            <a class="red" href="https://linktr.ee/MirageTeam1" target="_blank">Linktree</a>
            <a class="red" href="https://www.youtube.com/@MirageTeamGJ" target="_blank">YouTube</a>
        </div>

        <div class="submenu" style="display:flex; justify-content:center; gap:20px; flex-wrap:wrap; margin-top:20px;">
            <button class="action" style="font-size:15px; padding:10px 20px;" onclick="redesValens()">
                👤 ${lang==="es"?"Redes Valens429":"Valens429 Socials"}
            </button>
            <button class="action" style="font-size:15px; padding:10px 20px;" onclick="redesSejero()">
                👤 ${lang==="es"?"Redes SejeroDEV":"SejeroDEV Socials"}
            </button>
        </div>
    `,"redes");
}

function redesValens(){
    setContent(`
        <img src="images/valens.png" class="profile-pic" alt="Valens429">
        <h1 style="margin-top: 5px;">Valens429</h1>
        <p style="color: #B3E5FC; margin-top: 0;">${lang==="es"?"Mis redes personales":"My personal links"}</p>
        
        <div class="redes-grid">
            <a class="red" href="https://www.youtube.com/@Valens429VODs?sub_confirmation=1" target="_blank">YouTube</a>
            <a class="red" href="https://www.twitch.tv/nyxr_ar" target="_blank">Twitch</a>
            <a class="red" href="https://www.youtube.com/@CodigoDeterminacion?sub_confirmation=1" target="_blank">Canal UTDR</a>
            <a class="red" href="https://gamejolt.com/@Valens429" target="_blank">GameJolt</a>
            <a class="red" href="https://discord.com/invite/AY5BDRRpP6" target="_blank">Discord</a>
            <a class="red" href="https://www.tiktok.com/@nyxrar" target="_blank">TikTok</a>
        </div>

        <div class="submenu">
            <button class="action" onclick="redes()">← ${lang==="es"?"Volver":"Back"}</button>
        </div>
    `,"redesValens");
}

function redesSejero(){
    setContent(`
        <img src="images/sejero.png" class="profile-pic" alt="SejeroDEV">
        <h1 style="margin-top: 5px;">SejeroDEV</h1>
        <p style="color: #B3E5FC; margin-top: 0;">${lang==="es"?"Mis redes personales":"My personal links"}</p>
        
        <div class="redes-grid">
            <a class="red" href="https://gamejolt.com/@SejeroDev" target="_blank">GameJolt</a>
            <a class="red" href="https://www.youtube.com/@El-EseEse" target="_blank">Canal UTDR</a>
            <a class="red" href="https://soundcloud.com/sejerodev" target="_blank">SoundCloud</a>
            <a class="red" href="https://discord.gg/kP3HScENKd" target="_blank">Discord</a>
        </div>

        <div class="submenu">
            <button class="action" onclick="redes()">← ${lang==="es"?"Volver":"Back"}</button>
        </div>
    `,"redesSejero");
}

function dog(){
    if(dogCooldown) return;
    dogCooldown=true;
    dogCount++;
    document.getElementById("dog-counter").textContent=""+dogCount;
    const audio=new Audio("audio/dog.mp3");
    audio.play();
    audio.onended=()=>dogCooldown=false;
}
</script>

</body>
</html>
