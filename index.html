<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Mirage</title>

<link rel="icon" type="image/png" sizes="64x64" href="images/favicon-64.png">

<style>
#loader {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100vh;
    background: #050510;
    color: #00CFFF;
    z-index: 9999;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Courier New', Courier, monospace;
    font-size: 1.5rem;
    font-weight: bold;
    transition: opacity 0.8s ease, visibility 0.8s ease;
}

.blink { animation: blinker 1s linear infinite; }
@keyframes blinker { 50% { opacity: 0; } }

.crt::before {
    content: " ";
    display: block;
    position: absolute;
    top: 0; left: 0; bottom: 0; right: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
    background-size: 100% 3px;
    z-index: 999;
    pointer-events: none;
}

#lightbox {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.85); display: flex; justify-content: center;
    align-items: center; z-index: 2000; opacity: 0; visibility: hidden;
    transition: opacity 0.3s; backdrop-filter: blur(5px);
}
#lightbox.active { opacity: 1; visibility: visible; }
#lightbox-img { max-width: 90%; max-height: 90%; border-radius: 10px; border: 2px solid #00CFFF; box-shadow: 0 0 30px rgba(0,207,255,0.5); }
.close-btn { position: absolute; top: 20px; right: 30px; color: #00CFFF; font-size: 40px; background: none; border: none; cursor: pointer; font-weight: bold; }

body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    background: linear-gradient(-45deg, #00AEEF, #004b87, #0b1021, #007ACC);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    cursor: crosshair; 
}

@keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

body.hyper-mode {
    animation: hyperRainbow 0.5s infinite;
}
@keyframes hyperRainbow {
    0% { filter: hue-rotate(0deg); }
    100% { filter: hue-rotate(360deg); }
}

.navbar {
    position: fixed;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 15px;
    background: rgba(255,255,255,.1);
    backdrop-filter: blur(10px);
    padding: 10px 15px;
    border-radius: 12px;
    z-index: 100;
    border: 1px solid rgba(255,255,255,0.2);
}

.navbar button {
    background: none; border: none; color: white;
    font-weight: bold; cursor: pointer;
    padding: 6px 12px; border-radius: 6px;
    transition: 0.2s;
}

.navbar button:hover {
    background: rgba(0, 207, 255, 0.3);
    text-shadow: 0 0 10px #00CFFF;
}

.container {
    max-width: 760px;
    width: 90%;
    max-height: 65vh;
    background: rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(0, 207, 255, 0.3);
    padding: 20px 25px;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 20px rgba(0, 207, 255, 0.1);
    transition: opacity .4s ease, transform .4s ease;
    overflow-y: auto; 
    -ms-overflow-style: none; scrollbar-width: none;
}
.container::-webkit-scrollbar { display: none; }

.hidden { opacity: 0; transform: translateY(-15px) scale(0.95); }

.thumbnail {
    max-width: 190px;
    margin: 10px; 
    border-radius: 10px;
    cursor: pointer; 
    transition: .3s;
    border: 2px solid transparent;
}
.thumbnail:hover {
    transform: scale(1.1) translateY(-5px);
    border-color: #00CFFF;
    box-shadow: 0 5px 15px rgba(0,207,255,0.5);
}

.screenshot-gallery {
    display: flex; justify-content: center;
    gap: 10px; overflow-x: auto; padding: 10px;
    background: rgba(0,0,0,0.3); border-radius: 10px; margin-bottom: 20px;
    scrollbar-width: thin; scrollbar-color: #00CFFF transparent;
}
.screenshot-gallery::-webkit-scrollbar { height: 6px; }
.screenshot-gallery::-webkit-scrollbar-thumb { background-color: #00CFFF; border-radius: 3px; }
.screenshot { height: 80px; width: auto; object-fit: cover; border-radius: 5px; cursor: pointer; transition: 0.2s; border: 1px solid rgba(255,255,255,0.2); flex-shrink: 0; }
.screenshot:hover { transform: scale(1.05); border-color: #00CFFF; box-shadow: 0 0 10px rgba(0,207,255,0.3); }

button.action {
    background: linear-gradient(45deg,#00CFFF,#007ACC);
    border: none; color: white; padding: 10px 18px;
    border-radius: 8px; cursor: pointer; margin: 5px;
    font-weight: bold; transition: 0.2s;
}
button.action:hover {
    transform: scale(1.05);
    box-shadow: 0 0 15px #00CFFF;
}

.submenu {
    margin-top: 15px; padding-top: 15px;
    border-top: 1px solid rgba(255,255,255,.2);
}

.redes-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(140px,1fr));
    gap: 12px; margin-top: 16px;
}

.red {
    padding: 10px; border-radius: 10px;
    background: rgba(255,255,255,.1);
    font-weight: bold; transition: .2s;
    text-decoration: none; color: white; font-size: 14px;
    border: 1px solid transparent;
}
.red:hover {
    transform: translateY(-3px);
    background: rgba(0, 207, 255, 0.2);
    border-color: #00CFFF;
    box-shadow: 0 0 10px rgba(0,207,255,0.4);
}

.hero-subtitle {
    color: #00CFFF; font-weight: bold; text-transform: uppercase;
    letter-spacing: 3px; font-size: 13px; margin-bottom: 15px;
    background: rgba(0,0,0,0.5); display: inline-block;
    padding: 5px 15px; border-radius: 20px;
    border: 1px solid #00CFFF;
}

.texto-destacado { font-size: 16px; line-height: 1.5; margin-bottom: 15px; }

.dev-cards { display: flex; justify-content: center; gap: 15px; margin: 20px 0; flex-wrap: wrap; }
.dev-card {
    background: rgba(0, 0, 0, 0.4); padding: 12px 20px;
    border-radius: 12px; border: 1px solid rgba(255,255,255,0.2);
    transition: 0.3s; cursor: pointer;
    flex: 1 1 120px;
    max-width: 180px;
}
.dev-card:hover {
    transform: translateY(-5px); background: rgba(0, 207, 255, 0.2);
    border-color: #00CFFF; box-shadow: 0 5px 15px rgba(0, 207, 255, 0.3);
}
.dev-card h3 { margin: 0 0 5px 0; font-size: 18px; color: #fff; }
.dev-card p { margin: 0; font-size: 11px; color: #00CFFF; text-transform: uppercase; font-weight: bold; }

.profile-pic {
    width: 120px; height: 120px; 
    border-radius: 50%;
    object-fit: cover; border: 4px solid rgba(255,255,255,0.3);
    box-shadow: 0 0 15px rgba(0, 207, 255, 0.5);
    margin-bottom: 10px; transition: 0.3s;
}
.profile-pic:hover { transform: scale(1.05) rotate(5deg); border-color: #00CFFF; }

.site-footer {
    position: fixed; bottom: 0; left: 0; width: 100%; padding: 8px;
    font-size: 12px; background: rgba(0,0,0,0.5); z-index: 10;
    font-family: 'Courier New', Courier, monospace; letter-spacing: 1px;
}
#lang-btn {
    position: fixed; bottom: 40px; left: 20px; background: rgba(0,0,0,.5);
    border: 1px solid #00CFFF; color: #00CFFF; font-weight: bold;
    padding: 10px 16px; border-radius: 10px; cursor: pointer; z-index: 50;
    transition: 0.2s;
}
#lang-btn:hover { background: #00CFFF; color: black; box-shadow: 0 0 15px #00CFFF; }

#mute-btn {
    position: fixed; bottom: 40px; left: 125px; background: rgba(0,0,0,.5);
    border: 1px solid #00CFFF; color: #00CFFF; font-size: 18px; font-weight: bold;
    padding: 8px 14px; border-radius: 10px; cursor: pointer; z-index: 50;
    transition: 0.2s;
}
#mute-btn:hover { background: #00CFFF; color: black; box-shadow: 0 0 15px #00CFFF; }

.dog-button {
    position: fixed; bottom: 40px; right: 20px; width: 70px;
    cursor: pointer; animation: spin 4s linear infinite; z-index: 50;
    transition: 0.2s;
}
.dog-button:hover { filter: drop-shadow(0 0 10px #00CFFF) brightness(1.2); }

#dog-counter {
    position: fixed; 
    bottom: 115px; 
    right: 20px; 
    width: 70px; 
    font-weight: bold;
    opacity: .9; 
    text-align: center; 
    z-index: 50; 
    text-shadow: 0 0 5px black;
    pointer-events: none;
}
@keyframes spin { to {transform: rotate(360deg);} }
</style>
</head>

<body class="crt"> 

<div id="loader">
    <span id="load-text">> SYSTEM BOOTING<span class="blink">_</span></span>
</div>

<div id="lightbox" onclick="closeLightbox()">
    <img id="lightbox-img" src="" alt="Zoom">
    <button class="close-btn">&times;</button>
</div>

<nav class="navbar" id="navbar">
    <button onclick="checkHash('inicio')"></button>
    <button onclick="checkHash('proyectos')"></button>
    <button onclick="checkHash('traducciones')"></button>
    <button onclick="checkHash('redes')"></button>
</nav>

<div class="container" id="content"></div>

<div id="dog-counter">🐶</div>

<footer class="site-footer" id="site-footer"></footer>

<button id="lang-btn" onclick="toggleLang()">ENGLISH</button>
<button id="mute-btn" onclick="toggleMute()">🔈</button>
<img src="images/toby.png" class="dog-button" onclick="dog()" alt="perro">

<script>

const bgMusic = new Audio("audio/song.wav");
bgMusic.loop = true;
bgMusic.volume = 0.4;
let musicStarted = false;
let isMuted = false;

document.addEventListener("click", () => {
    if (!musicStarted && !isMuted) {
        bgMusic.play().catch(e => console.log("Interacción necesaria para audio."));
        musicStarted = true;
    }
});

function toggleMute() {
    isMuted = !isMuted;
    const muteBtn = document.getElementById('mute-btn');
    if (isMuted) {
        bgMusic.pause();
        muteBtn.textContent = '🔇';
    } else {
        muteBtn.textContent = '🔈';
        if(musicStarted) bgMusic.play();
    }
    sfxClick();
}

const AudioContext = window.AudioContext || window.webkitAudioContext;
const audioCtx = new AudioContext();

function playTone(freq, type, duration, vol) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + duration);
}

function sfxHover() { playTone(800, 'sine', 0.1, 0.05); }
function sfxClick() { playTone(400, 'square', 0.15, 0.1); }

function bindAudioToButtons() {
    const interactables = document.querySelectorAll('button, .thumbnail, .dev-card, .red, .screenshot');
    interactables.forEach(el => {
        if(!el.dataset.audioBound) {
            el.addEventListener('mouseenter', sfxHover);
            el.addEventListener('mousedown', sfxClick);
            el.dataset.audioBound = "true";
        }
    });
}

function openLightbox(src) {
    const lb = document.getElementById('lightbox');
    const img = document.getElementById('lightbox-img');
    img.src = src;
    lb.classList.add('active');
    sfxClick();
}
function closeLightbox() {
    document.getElementById('lightbox').classList.remove('active');
}

window.addEventListener('load', () => {
    setTimeout(() => {
        document.getElementById('load-text').innerHTML = "> ACCESS GRANTED<span class='blink'>_</span>";
        setTimeout(() => {
            document.getElementById('loader').style.opacity = '0';
            setTimeout(() => document.getElementById('loader').style.visibility = 'hidden', 800);
        }, 500);
    }, 1000);
});

const konamiCode = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a'];
let konamiIndex = 0;
document.addEventListener('keydown', (e) => {
    if (e.key === konamiCode[konamiIndex] || e.key === konamiCode[konamiIndex].toLowerCase()) {
        konamiIndex++;
        if (konamiIndex === konamiCode.length) {
            document.body.classList.toggle('hyper-mode');
            playTone(1200, 'square', 0.5, 0.2);
            konamiIndex = 0;
        }
    } else { konamiIndex = 0; }
});

let content;
let currentSection="";
let lang="es";
let dogCooldown=false;
let dogCount=0;

document.addEventListener("DOMContentLoaded",()=>{
    content=document.getElementById("content");
    updateDynamicText();
    checkHash();
});

window.addEventListener("hashchange", () => {
    checkHash();
});

function updateDynamicText(){
    const b=document.querySelectorAll("#navbar button");
    if(lang==="es"){
        b[0].textContent="Inicio";
        b[1].textContent="Proyectos";
        b[2].textContent="Traducciones";
        b[3].textContent="Redes";
        document.getElementById("site-footer").innerHTML=">_ MIRAGE TEAM OS // V.2026 // ALL RIGHTS RESERVED.";
    }else{
        b[0].textContent="Home";
        b[1].textContent="Projects";
        b[2].textContent="Translations";
        b[3].textContent="Socials";
        document.getElementById("site-footer").innerHTML=">_ MIRAGE TEAM OS // V.2026 // ALL RIGHTS RESERVED.";
    }
}

function toggleLang(){
    lang = lang==="es" ? "en":"es";
    document.getElementById("lang-btn").textContent = lang==="es" ? "ENGLISH":"ESPAÑOL";
    updateDynamicText();
    checkHash(); 
}

function setContent(html, section, customHash){
    let finalHash = customHash || section;
    if(currentSection===finalHash && finalHash!=="inicio") return;
    currentSection=finalHash;
    
    if(finalHash === 'inicio') history.pushState(null, null, window.location.pathname);
    else history.pushState(null, null, '#' + finalHash);

    content.classList.add("hidden");
    setTimeout(()=>{
        content.innerHTML=html;
        content.classList.remove("hidden");
        bindAudioToButtons();
    },300);
}

function checkHash(forceHash) {
    let h = forceHash || window.location.hash.substring(1);
    if (!h || h === 'inicio') { inicio(); return; }

    if (h === 'proyectos') proyectos();
    else if (h === 'proyectosIndividuales') proyectosIndividuales();
    else if (h === 'valens429') valens429();
    else if (h === 'sejerodev') sejerodev();
    else if (h === 'zerex') zerex();
    else if (h === 'herramientas') herramientas();
    else if (h === 'traducciones') traducciones();
    else if (h === 'redes') redes();
    else if (h === 'udtsl') udtsl();
    else if (h === 'purrfect2') purrfect2();
    else if (h === 'Miragepro') miragepro(); 
    
    else if (h === 'valens429_redes') redesValens();
    else if (h === 'sejerodev_redes') redesSejero();
    else if (h === 'zerex_redes') redesZerex();

    else if (h === 'DXC') proyecto('Deltarune x Cult of the Lamb', lang==="es"?"Fangame crossover con combates y lore oscuro.":"Crossover fangame with battles and dark lore.", 'https://gamejolt.com/games/COTLXDR/975891', 'proyectos', 'DXC', 'DXC');
    else if (h === 'UB') proyecto('Undertale Bastille', lang==="es"?"Proyecto inspirado en Undertale con nuevas mecánicas.":"Undertale-inspired project with new mechanics.", 'https://gamejolt.com/games/Undertale-Bastille/987997', 'proyectos', 'UB', 'UB');
    else if (h === 'PPE') proyecto('Papers Please España', lang==="es"?"Una parodia de Papers Please creada a base de memes.":"A parody of Papers Please created using memes.", 'https://gamejolt.com/games/PAPERSPLEASECESP/997156', 'proyectos', 'PPE', 'PPE');
    else if (h === 'SZ') proyecto('Session Zero', lang==="es"?"Session Zero es una experiencia de terror interactivo donde nada es lo que parece ¿Podras sobrevivir a la entrevistar?":"Session Zero is an interactive horror experience where nothing is what it seems. Will you be able to survive the interview?", 'https://gamejolt.com/games/SessionZero/1031786', 'valens429', 'SZ', 'SZ');
    else if (h === 'SC') proyecto('Seii´s Crackhouse', lang==="es"?"Versión modificada de Raldis Crackhouse para el streamer Seii__.":"Modified version of Raldis Crackhouse for the streamer Seii__.", 'https://gamejolt.com/games/SEIICRACKHOUSE/973565', 'valens429', 'SC', 'SC');
    else if (h === 'SE') proyecto('Sonic Exodus', lang==="es"?"Un nuevo fangame de la saga del erizo azul.":"A new fangame from the blue blur series.", 'https://gamejolt.com/games/Sonic-Exodus/1031667', 'sejerodev', 'SE', 'SE');
    else if (h === 'CTC') proyecto('Cony the Confronter', lang==="es"?"Una aventura única llena de desafíos.":"A unique adventure full of challenges.", 'https://gamejolt.com/games/Cony-the-Confronter/973146', 'sejerodev', 'CTC', 'CTC');
    else if (h === 'ZA') proyecto('Zerex Adventure', lang==="es"?"¿Podrás enviar a Zerex de vuelta a casa? ¿O morirás en el intento...?":"Will you be able to send Zerex back home? Or will you die trying...?", 'https://gamejolt.com/games/ZA/1035816', 'zerex', 'ZA', 'ZA');
    else if (h === 'RT') proyecto('RetornedTale', lang==="es"?"has caido a un mundo bajo tierra en busca de algo, una voluntad que te llama, al rescate, manten tu esperanza radiante y sigue adelante, bex.":"You have fallen into a world underground in search of something, a will that calls you to the rescue, keep your hope radiant and move on, bex.", 'https://gamejolt.com/games/RETORNEDTALE/1031100', 'zerex', 'RT', 'RT');
    else if (h === 'DSFM') proyecto('DELTARUNE Save File Management', lang==="es"?"Administra tus partidas de forma rápida y segura.":"Manage your games quickly and securely.", 'https://gamejolt.com/games/DELTARUNESAVE/1006615', 'herramientas', 'DSFM', 'DSFM');
    else if (h === 'SMM') proyecto('Soul Mod Manager', lang==="es"?"Un gestor de mods para personalizar tu experiencia.":"A mod manager to customize your experience.", 'https://gamejolt.com/games/SMM/978626', 'herramientas', 'SMM', 'SMM');
    
    else inicio(); 
}

    setContent(`
        <h1 style="font-size: 2.5em; margin-bottom: 5px; margin-top: 0; text-shadow: 0 0 10px #00CFFF;">Mirage Team</h1>
        <div class="hero-subtitle">

    `,"valens429");
}

function sejerodev(){
    setContent(`
        <h1 style="margin-top:0;">SejeroDEV</h1>
        <img src="images/sonic.png" class="thumbnail" onclick="checkHash('SE')">
        <img src="images/cony.png" class="thumbnail" onclick="checkHash('CTC')">
        <div class="submenu"><button class="action" onclick="checkHash('proyectosIndividuales')">← ${lang==="es"?"Volver":"Back"}</button></div>

}

function zerex(){

        <h1 style="margin-top:0;">Zerex</h1>
        <img src="images/zerex1.png" class="thumbnail" alt="Zerex Adventure" onclick="checkHash('ZA')">

function herramientas(){
